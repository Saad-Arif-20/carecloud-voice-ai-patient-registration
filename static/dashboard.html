<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CareCloud — Patients Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0a0f1a;
    --bg-elev: #111827;
    --bg-elev-2: #161f30;
    --border: #232f45;
    --text: #e8ecf3;
    --text-dim: #8b96ab;
    --text-faint: #5b6579;
    --accent: #4f7fff;
    --accent-dim: #1c2b4d;
    --good: #34d399;
    --good-bg: #0f2e26;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb; --bg-elev: #ffffff; --bg-elev-2: #f8f9fc;
      --border: #e3e7f0; --text: #1a2233; --text-dim: #626e85; --text-faint: #9aa4b8;
      --accent: #3b63e0; --accent-dim: #e8edff; --good: #0f9d68; --good-bg: #e6f8f0;
      --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px -8px rgba(20,30,60,.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    padding: clamp(1.25rem, 3vw, 2.5rem);
  }
  .container { max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .title-block h1 { font-size: 1.5rem; margin: 0 0 0.3rem; letter-spacing: -0.01em; font-weight: 700; display: flex; align-items: center; gap: 0.55rem; }
  .title-block h1 .logo-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; box-shadow: 0 0 0 4px var(--accent-dim); }
  .title-block p { margin: 0; color: var(--text-dim); font-size: 0.85rem; }
  .title-block code { background: var(--bg-elev-2); border: 1px solid var(--border); padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.8em; }

  .stat-pill {
    display: flex; align-items: center; gap: 0.5rem; background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.45rem 0.9rem 0.45rem 0.6rem; box-shadow: var(--shadow); white-space: nowrap;
  }
  .stat-pill .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); animation: pulse 2s infinite; }
  .stat-pill b { font-variant-numeric: tabular-nums; }
  .stat-pill span.label { color: var(--text-dim); font-size: 0.82rem; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .toolbar { display: flex; gap: 0.6rem; margin-bottom: 1.1rem; flex-wrap: wrap; align-items: center; }
  .search-field { position: relative; flex: 1 1 220px; max-width: 280px; }
  .search-field svg { position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }
  input[type="text"] {
    width: 100%; font-size: 0.88rem; padding: 0.55rem 0.7rem 0.55rem 2.1rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input[type="text"]::placeholder { color: var(--text-faint); }
  button {
    font-size: 0.86rem; padding: 0.55rem 0.95rem; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; font-weight: 600; transition: background .15s, opacity .15s, transform .1s;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }
  .toolbar-spacer { flex: 1; }
  .refresh-note { color: var(--text-faint); font-size: 0.78rem; display: flex; align-items: center; gap: 0.35rem; }

  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 720px; }
  th, td { text-align: left; padding: 0.7rem 0.9rem; white-space: nowrap; }
  thead th {
    color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--bg-elev-2); border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-elev-2); }
  .name-cell { display: flex; align-items: center; gap: 0.6rem; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .name-text { font-weight: 600; }
  .sub-text { color: var(--text-dim); font-size: 0.9em; }
  .badge {
    font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 999px;
    background: var(--good-bg); color: var(--good); display: inline-block;
  }
  .muted { color: var(--text-faint); }

  .empty-state, .loading-state { padding: 3.5rem 1rem; text-align: center; color: var(--text-dim); }
  .empty-state .icon, .loading-state .icon { font-size: 1.8rem; margin-bottom: 0.6rem; opacity: 0.6; }
  .skeleton-row td { padding: 0.85rem 0.9rem; }
  .skeleton-bar { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-elev-2) 25%, var(--border) 37%, var(--bg-elev-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  /* Detail modal */
  .overlay { position: fixed; inset: 0; background: rgba(5,8,15,0.55); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; transform: translateY(8px) scale(0.98); transition: transform .15s;
  }
  .overlay.open .modal { transform: translateY(0) scale(1); }
  .modal-header { display: flex; align-items: center; gap: 0.8rem; padding: 1.25rem 1.25rem 1rem; border-bottom: 1px solid var(--border); }
  .modal-header .avatar { width: 44px; height: 44px; font-size: 1rem; }
  .modal-header h2 { margin: 0; font-size: 1.05rem; }
  .modal-header p { margin: 0.15rem 0 0; color: var(--text-dim); font-size: 0.8rem; }
  .modal-close { margin-left: auto; background: transparent; border: none; color: var(--text-dim); font-size: 1.1rem; cursor: pointer; padding: 0.3rem; line-height: 1; border-radius: 6px; }
  .modal-close:hover { background: var(--bg-elev-2); color: var(--text); }
  .modal-body { padding: 1rem 1.25rem 1.4rem; }
  .field-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.86rem; }
  .field-row:last-child { border-bottom: none; }
  .field-row .k { color: var(--text-dim); flex-shrink: 0; }
  .field-row .v { text-align: right; word-break: break-word; }
  .id-copy { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; color: var(--text-dim); font-family: ui-monospace, monospace; font-size: 0.78rem; background: var(--bg-elev-2); border: 1px solid var(--border); padding: 0.15rem 0.5rem; border-radius: 6px; }
  .id-copy:hover { color: var(--text); border-color: var(--text-faint); }
  .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--text); color: var(--bg); padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all .2s; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-block">
        <h1><span class="logo-dot"></span>CareCloud Patients</h1>
        <p>Live view of <code>GET /patients</code> &mdash; persists across restarts and redeploys.</p>
      </div>
      <div class="stat-pill">
        <span class="pulse"></span>
        <b id="count">—</b><span class="label">registered</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="lastName" placeholder="Filter by last name" />
      </div>
      <div class="search-field">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <input type="text" id="phone" placeholder="Filter by phone" />
      </div>
      <button class="btn-primary" onclick="load()">Search</button>
      <button class="btn-ghost" onclick="clearFilters()">Clear</button>
      <div class="toolbar-spacer"></div>
      <div class="refresh-note" id="refreshNote">Auto-refreshing</div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Patient</th><th>DOB</th><th>Sex</th><th>Phone</th><th>City / State</th><th>Language</th><th>Registered</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="loadingState" class="loading-state" style="display:none;">
        <div class="icon">⋯</div>Loading patients&hellip;
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="icon">🔍</div>No patients match that search.
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    let currentPatients = [];
    let firstLoad = true;

    async function load() {
      const lastName = document.getElementById('lastName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const params = new URLSearchParams();
      if (lastName) params.set('last_name', lastName);
      if (phone) params.set('phone_number', phone);

      const rowsEl = document.getElementById('rows');
      const loadingEl = document.getElementById('loadingState');
      const emptyEl = document.getElementById('emptyState');

      if (firstLoad) {
        loadingEl.style.display = 'block';
        rowsEl.innerHTML = '';
      }

      let json;
      try {
        const res = await fetch('/patients?' + params.toString());
        json = await res.json();
      } catch (e) {
        loadingEl.style.display = 'none';
        emptyEl.innerHTML = '<div class="icon">⚠️</div>Could not reach the API.';
        emptyEl.style.display = 'block';
        return;
      }

      firstLoad = false;
      loadingEl.style.display = 'none';

      const patients = json.data || [];
      currentPatients = patients;
      document.getElementById('count').textContent = patients.length;
      emptyEl.style.display = patients.length ? 'none' : 'block';
      rowsEl.innerHTML = '';

      for (const p of patients) {
        const tr = document.createElement('tr');
        tr.onclick = () => openModal(p);
        tr.innerHTML = `
          <td>
            <div class="name-cell">
              <div class="avatar" style="background:${colorFor(p.first_name + p.last_name)}">${initials(p.first_name, p.last_name)}</div>
              <div>
                <div class="name-text">${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</div>
                <div class="sub-text">${escapeHtml(p.email || 'no email on file')}</div>
              </div>
            </div>
          </td>
          <td>${escapeHtml(p.date_of_birth)}</td>
          <td>${escapeHtml(p.sex)}</td>
          <td>${escapeHtml(formatPhone(p.phone_number))}</td>
          <td>${escapeHtml(p.city)}, ${escapeHtml(p.state)}</td>
          <td><span class="badge">${escapeHtml(p.preferred_language)}</span></td>
          <td class="muted" title="${new Date(p.created_at).toLocaleString()}">${relativeTime(p.created_at)}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    function openModal(p) {
      const modal = document.getElementById('modal');
      const addr = [p.address_line_1, p.address_line_2, p.city, p.state, p.zip_code].filter(Boolean).join(', ');
      const rows = [
        ['Date of birth', escapeHtml(p.date_of_birth)],
        ['Sex', escapeHtml(p.sex)],
        ['Phone', escapeHtml(formatPhone(p.phone_number))],
        ['Email', escapeHtml(p.email || '—')],
        ['Address', escapeHtml(addr)],
        ['Insurance', escapeHtml(p.insurance_provider || '—')],
        ['Member ID', escapeHtml(p.insurance_member_id || '—')],
        ['Preferred language', escapeHtml(p.preferred_language)],
        ['Emergency contact', p.emergency_contact_name ? `${escapeHtml(p.emergency_contact_name)} (${escapeHtml(formatPhone(p.emergency_contact_phone))})` : '—'],
        ['Registered', new Date(p.created_at).toLocaleString()],
        ['Last updated', new Date(p.updated_at).toLocaleString()],
      ];
      modal.innerHTML = `
        <div class="modal-header">
          <div class="avatar" style="background:${colorFor(p.first_name + p.last_name)}">${initials(p.first_name, p.last_name)}</div>
          <div>
            <h2>${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</h2>
            <p>Patient record</p>
          </div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          ${rows.map(([k, v]) => `<div class="field-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
          <div class="field-row">
            <span class="k">Patient ID</span>
            <span class="id-copy" onclick="copyId('${p.patient_id}')">${p.patient_id.slice(0, 13)}&hellip; 📋</span>
          </div>
        </div>
      `;
      document.getElementById('overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('open');
    }

    function copyId(id) {
      navigator.clipboard?.writeText(id).catch(() => {});
      showToast('Patient ID copied');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function initials(first, last) {
      return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase();
    }

    const AVATAR_COLORS = ['#4f7fff', '#a855f7', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#ef4444', '#8b5cf6'];
    function colorFor(seed) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }

    function formatPhone(p) {
      if (!p || p.length !== 10) return p || '—';
      return `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`;
    }

    function relativeTime(iso) {
      const diffMs = Date.now() - new Date(iso + 'Z').getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function clearFilters() {
      document.getElementById('lastName').value = '';
      document.getElementById('phone').value = '';
      load();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    let debounceTimer;
    for (const id of ['lastName', 'phone']) {
      document.getElementById(id).addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(load, 350);
      });
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { clearTimeout(debounceTimer); load(); }
      });
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
